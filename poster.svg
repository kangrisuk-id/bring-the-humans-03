  <path d="M 68 508 H 1132" fill="none" stroke="#A79FB5" stroke-width="1" stroke-opacity="0.3"/>
  <text x="68" y="554" fill="#F4F1F7" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="650">make.fun/bounty/bring-the-humans-03</text>
  <text x="552" y="554" fill="#A79FB5" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400">Play code: makefun-cake-buoy-gem</text>
  <text x="1016" y="554" fill="#9C7BFF" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700">@kangrisuk</text>
